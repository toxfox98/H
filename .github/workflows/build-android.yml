"); async function loadCards(){ const sources=["./data/cards.json","https://github.com/LouisCourrian/riftbound-cards/releases/latest/download/cards.json"]; for(const url of sources){ try{ const res=await fetch(url,{cache:"no-store"}); if(!res.ok) throw new Error(`card data ${res.status}`); const raw=await res.json(); if(!Array.isArray(raw)) throw new Error("card data is not an array"); allCards=raw.map(normalizeCard); break; }catch(e){ console.warn("Card source unavailable:",url,e.message); } } cardsById=new Map(allCards.map(c=>[c.id,c])); useCardDatabase(cardsById); cards=allCards; render(); } function currentList(){ if(activeTab==="legend") return cards.filter(c=>c.isLegend); if(activeTab==="champion") return cards.filter(c=>c.isChampion && !c.isSignature); if(activeTab==="runes") return cards.filter(c=>c.isRune); if(activeTab==="battlefields") return cards.filter(c=>c.isBattlefield); return cards.filter(c=>!c.isLegend&&!c.isRune&&!c.isBattlefield); } function filtered(){ const q=search.toLowerCase().trim(); let result=currentList().filter(c=> (filterType==="All"||c.type===filterType)&& (filterSet==="All"||c.setCode===filterSet)&& (filterDomain==="All"||c.domains.includes(filterDomain))&& (showBanned||(!cardIsBanned(c)&&!c.isBattlefield||!bannedBattlefield(c)))&& (!q||cardSearchText(c).includes(q)) ); return result.sort((a,b)=>sortBy==="set" ? `${a.setCode}${a.name}`.localeCompare(`${b.setCode}${b.name}`) : a.name.localeCompare(b.name)).slice(0,240); } function bannedBattlefield(c){ return c?.isBattlefield && ["Dreaming Tree","Obelisk of Power","Reaver's Row","Reaver’s Row"].includes(c.name); } function saveDeck(){ const name=prompt("Deck name:", savedDecks[0]?.name||"My Riftbound Deck"); if(!name)return; const clean={...structuredClone(deck), main:deck.main.map(c=>c.id), runes:deck.runes.map(c=>c.id), savedAt:new Date().toISOString()}; savedDecks=[{name,...clean},...savedDecks.filter(x=>x.name!==name)]; localStorage.setItem("riftbound-decks-v3",JSON.stringify(savedDecks)); alert(`Saved "${name}".`); } function loadSavedDeck(){ if(!savedDecks.length){alert("No saved decks yet.");return;} const menu=savedDecks.map((d,i)=>`${i+1}. ${d.name}`).join("\n"); const pick=Number(prompt(`Load deck:\n\n${menu}\n\nEnter a number:`))-1; if(!savedDecks[pick])return; const d=savedDecks[pick]; deck={legend:d.legend||null,chosenChampion:d.chosenChampion||null,main:(d.main||[]).map(id=>cardsById.get(id)).filter(Boolean),runes:(d.runes||[]).map(id=>cardsById.get(id)).filter(Boolean),battlefields:d.battlefields||[]}; render(); } function exportDeck(){ const out=["Riftbound Deck",`Legend: ${cardsById.get(deck.legend)?.name||""}`,`Champion: ${cardsById.get(deck.chosenChampion)?.name||""}`,"","Main Deck",...Object.entries(deck.main.reduce((m,c)=>(m[c.name]=(m[c.name]||0)+1,m),{})).map(([n,c])=>`${c} ${n}`),"","Rune Deck",...Object.entries(deck.runes.reduce((m,c)=>(m[c.name]=(m[c.name]||0)+1,m),{})).map(([n,c])=>`${c} ${n}`),"","Battlefields",...deck.battlefields.map(id=>cardsById.get(id)?.name||id)].join("\n"); navigator.clipboard?.writeText(out); alert("Deck list copied to clipboard.\n\n"+out); } function showCard(c){cardModal=c;render();} function addCard(c){ if(activeTab==="legend"){deck.legend=c.id;deck.chosenChampion=null;} else if(activeTab==="champion"){if(cardAllowedAsChampion(c,deck,cardsById))deck.chosenChampion=c.id;} else if(activeTab==="runes"){if(cardAllowedAsRune(c,deck,cardsById)&&deck.runes.length<RUNE_SIZE)deck.runes.push(c);} else if(activeTab==="battlefields"){if(cardAllowedAsBattlefield(c,deck,cardsById)&&deck.battlefields.length<BATTLEFIELD_COUNT)deck.battlefields.push(c.id);} else if(deck.main.length<MAIN_SIZE&&cardAllowedInMain(c,deck,cardsById))deck.main.push(c); render(); } function removeCard(c,tab){ if(tab==="main"){const i=deck.main.findIndex(x=>x.id===c.id);if(i>=0)deck.main.splice(i,1);} if(tab==="runes"){const i=deck.runes.findIndex(x=>x.id===c.id);if(i>=0)deck.runes.splice(i,1);} if(tab==="battlefields"){const i=deck.battlefields.indexOf(c.id);if(i>=0)deck.battlefields.splice(i,1);} render(); } function startGame(practice=false){ try { const errs=validateDeck(deck,cardsById); if(errs.length){alert(errs.join("\n"));return;} const d2=structuredClone(deck); game=createGame(deck,d2,{practice,p1Name:"You",p2Name:practice?"Practice Opponent":"Player 2"}); screen="game"; render(); } catch (e) { console.error(e); alert(`Unable to start the game.\n\n${e.message}`); } } function img(c){return c?.imageUrl||"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560"><rect width="100%" height="100%" fill="#18233a"/><text x="50%" y="48%" fill="#aab7d5" text-anchor="middle" font-family="sans-serif" font-size="24">${(c?.name||"Card").slice(0,22)}</text><text x="50%" y="54%" fill="#66789e" text-anchor="middle" font-family="sans-serif" font-size="14">Artwork unavailable</text></svg>`);} function cardTile(c,disabled=false){ return `<div class="card-wrap"><button class="card-tile ${disabled?"disabled":""}" data-add="${c.id}" ${disabled?"disabled":""}> <img src="${img(c)}" alt="${c.name}" loading="lazy"><div class="tile-meta"><b>${c.name}</b><span>${c.setCode} · ${c.type||"Card"}</span></div></button><button class="detail-btn" data-detail="${c.id}" title="View details">ⓘ</button></div>`; } function builder(){ const errs=validateDeck(deck,cardsById), list=filtered(), identity=deck.legend?(cardsById.get(deck.legend)?.domains||[]):[]; const mainCounts={};deck.main.forEach(c=>mainCounts[c.name]=(mainCounts[c.name]||0)+1); const types=[...new Set(currentList().map(c=>c.type).filter(Boolean))].sort(), domains=[...new Set(allCards.flatMap(c=>c.domains))].sort(); const selectedLegend=deck.legend&&cardsById.get(deck.legend), selectedChampion=deck.chosenChampion&&cardsById.get(deck.chosenChampion); return `<header><div><h1>RIFTBOUND</h1><span class="prototype">DIGITAL CARD LAB</span></div><div class="header-nav"> <button data-screen="builder">Deck Builder</button><button data-screen="cards">Card Gallery</button><button id="loadDeck">Load</button><button id="saveDeck">Save</button><button id="exportDeck">Export</button> </div><div class="header-right">Constructed · ${allCards.length||0} cards</div></header> <main class="builder-layout"> <section class="builder-left"> <div class="panel deck-summary"> <div><b>Champion Legend</b><span>${selectedLegend?selectedLegend.name:"Not selected"}</span></div> <div><b>Chosen Champion</b><span>${selectedChampion?selectedChampion.name:"Not selected"}</span></div> <div><b>Main Deck</b><span class="${deck.main.length===MAIN_SIZE?"ok":""}">${deck.main.length}/${MAIN_SIZE}</span></div> <div><b>Rune Deck</b><span class="${deck.runes.length===RUNE_SIZE?"ok":""}">${deck.runes.length}/${RUNE_SIZE}</span></div> <div><b>Battlefields</b><span class="${deck.battlefields.length===BATTLEFIELD_COUNT?"ok":""}">${deck.battlefields.length}/${BATTLEFIELD_COUNT}</span></div> <button id="start" ${errs.length?"disabled":""}>Start Game</button><button id="practice" ${errs.length?"disabled":""}>Two-Sided Practice</button> </div> <div class="panel tabs">${["main","legend","champion","runes","battlefields"].map(t=>`<button class="${activeTab===t?"active":""}" data-tab="${t}">${t==="main"?"Main Cards":t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div> <div class="panel filters"> ${activeTab==="battlefields"?'<div class="tab-help">Battlefields are colorless: choose any 3 distinct legal Battlefields. Domain restrictions do not apply.</div>':""} <input id="search" value="${search.replaceAll('"','&quot;')}" placeholder="Search cards..."> <select id="setFilter"><option>All</option>${[...new Set(allCards.map(c=>c.setCode))].sort().map(s=>`<option ${filterSet===s?"selected":""}>${s}</option>`).join("")}</select> <select id="typeFilter"><option>All</option>${types.map(t=>`<option ${filterType===t?"selected":""}>${t}</option>`).join("")}</select> <select id="domainFilter"><option>All</option>${domains.map(d=>`<option ${filterDomain===d?"selected":""}>${d}</option>`).join("")}</select> <select id="sortFilter"><option value="name" ${sortBy==="name"?"selected":""}>Sort: Name</option><option value="set" ${sortBy==="set"?"selected":""}>Sort: Set</option></select> <label class="toggle"><input id="showBanned" type="checkbox" ${showBanned?"checked":""}> Show banned</label> <span class="result-count">${filtered().length}+ results</span> </div> <div class="card-grid">${list.map(c=>{ let disabled=false; if(activeTab==="main") disabled=deck.main.length>=MAIN_SIZE||!cardAllowedInMain(c,deck,cardsById); if(activeTab==="legend") disabled=!!deck.legend; if(activeTab==="champion") disabled=!cardAllowedAsChampion(c,deck,cardsById); if(activeTab==="runes") disabled=deck.runes.length>=RUNE_SIZE||!cardAllowedAsRune(c,deck,cardsById); if(activeTab==="battlefields") disabled=deck.battlefields.length>=BATTLEFIELD_COUNT||!cardAllowedAsBattlefield(c,deck,cardsById); return cardTile(c,disabled); }).join("")}</div> </section> <aside class="builder-right"> <div class="panel"><h2>Deck</h2> <div class="chosen-card">${selectedLegend?cardTile(selectedLegend):"<span>Select a Legend</span>"}</div> <div class="chosen-card">${selectedChampion?cardTile(selectedChampion):"<span>Select a Chosen Champion</span>"}</div> <h3>Main Deck (${deck.main.length}/${MAIN_SIZE})</h3> <div class="deck-list">${Object.entries(mainCounts).map(([name,count])=>`<div><span>${count}× ${name}</span><button data-remove-main="${name}">−</button></div>`).join("")||"<small>No cards yet.</small>"}</div> <h3>Runes (${deck.runes.length}/${RUNE_SIZE})</h3> <div class="deck-list">${[...new Set(deck.runes.map(c=>c.name))].map(name=>{const n=deck.runes.filter(c=>c.name===name).length;return `<div><span>${n}× ${name}</span><button data-remove-rune="${name}">−</button></div>`}).join("")||"<small>No runes yet.</small>"}</div> <h3>Battlefields (${deck.battlefields.length}/${BATTLEFIELD_COUNT})</h3> <div class="deck-list">${deck.battlefields.map(id=>{const c=cardsById.get(id);return `<div><span>${c?.name||id}</span><button data-remove-bf="${id}">−</button></div>`}).join("")||"<small>No battlefields yet.</small>"}</div> <div class="deck-stats"><b>Deck stats</b><span>Unique ${new Set(deck.main.map(c=>c.name)).size}</span><span>Avg cost ${deck.main.length?(deck.main.reduce((s,c)=>s+Number(c.energy||0),0)/deck.main.length).toFixed(1):"0.0"}</span><span>Signatures ${deck.main.filter(c=>c.isSignature).length}/${3}</span></div> <div class="validation ${errs.length?"bad":"good"}">${errs.length?errs.map(e=>`<div>• ${e}</div>`).join(""):"✓ Deck is legal for this Constructed prototype."}</div> </div> </aside> </main>`; } function gallery(){ const types=[...new Set(allCards.map(c=>c.type).filter(Boolean))].sort(), domains=[...new Set(allCards.flatMap(c=>c.domains))].sort(); return `<header><div><h1>RIFTBOUND</h1><span class="prototype">CARD GALLERY</span></div><div class="header-nav"><button data-screen="builder">Deck Builder</button></div><div class="header-right">${allCards.length} cards</div></header> <main class="catalog"><div class="panel filters"> <input id="search" value="${search.replaceAll('"','&quot;')}" placeholder="Search name, rules text, tag, set..."> <select id="setFilter"><option>All</option>${[...new Set(allCards.map(c=>c.setCode))].sort().map(s=>`<option ${filterSet===s?"selected":""}>${s}</option>`).join("")}</select> <select id="typeFilter"><option>All</option>${types.map(t=>`<option ${filterType===t?"selected":""}>${t}</option>`).join("")}</select> <select id="domainFilter"><option>All</option>${domains.map(d=>`<option ${filterDomain===d?"selected":""}>${d}</option>`).join("")}</select> <select id="sortFilter"><option value="name" ${sortBy==="name"?"selected":""}>Name</option><option value="set" ${sortBy==="set"?"selected":""}>Set</option></select> <label class="toggle"><input id="showBanned" type="checkbox" ${showBanned?"checked":""}> Show banned</label> </div><div class="catalog-count">${filtered().length} shown · use ⓘ for card details</div> <div class="card-grid gallery-grid">${filtered().map(c=>cardTile(c,false)).join("")}</div></main>${cardModal?modalHTML():""}`; } function modalHTML(){ const c=cardModal; return `<div class="modal-backdrop" data-close-modal><div class="card-modal" onclick="event.stopPropagation()"><button class="modal-close" data-close-modal>×</button><img src="${c.imageUrl}" alt="${c.name}"><div><h2>${c.name}</h2><p><b>${c.type}</b> · ${c.setCode} · ${c.rarity||"Unknown"}</p><p>${c.domains.join(" · ")||"Colorless"}</p><p class="rules">${c.ability||"No rules text."}</p><p>Might: ${c.might??"—"} · Energy: ${c.energy??"—"} · Power: ${c.power??"—"}</p>${c.isSignature?'<span class="badge">Signature</span>':""}${cardIsBanned(c)||bannedBattlefield(c)?'<span class="badge banned">Banned</span>':""}</div></div></div>`; } function zoneCards(p,zone){return (p?.[zone]||[]).map(x=>{const c=CARDS[x.cardId];return `<button class="zone-card" data-inspect="${x.uid}" title="Inspect"><img src="${img(c)}"><span>${c?.name||x.cardId}</span></button>`}).join("")||'<span class="empty-zone">Empty</span>';} function boardUnit(u){const c=CARDS[u.cardId];const selected=contextTarget?.kind==='unit'&&contextTarget.uid===u.uid;return `<button draggable="true" class="unit ${u.exhausted?'exhausted':''} ${u.empowered?'empowered':''} ${selected?'context-selected':''}" data-unit="${u.uid}" data-context-unit="${u.uid}" data-inspect="${u.uid}"><img src="${img(c)}"><span>${c?.name||u.cardId}</span><b>${c?.might??'—'}</b></button>`;} function playerBar(p,label){return `<div class="panel playerbar"><div class="player-title"><b>${label}</b><small>${p.name}</small></div><span>⭐ ${p.points}/8</span><span>⚡ ${p.energy}/${p.maxEnergy}</span><span>Deck ${p.deck.length}</span><span>Hand ${p.hand.length}</span><span>Trash ${p.trash.length}</span><span>Banished ${p.banished.length}</span></div>`;} function actionForContext(actions){ if(!contextTarget) return actions; if(contextTarget.kind==='card') return actions.filter(a=>a.type==='PLAY'&&a.cardUid===contextTarget.uid); if(contextTarget.kind==='unit') return actions.filter(a=>a.unitUid===contextTarget.uid); return actions; } function mobileActionBar(actions){ const contextual=actionForContext(actions); const primary=contextual.filter(a=>["END_ACTION","END_TURN","DRAW","REVEAL_RUNE"].includes(a.type)); return `<div class="mobile-action-bar"><button data-mobile-panel="actions" class="${mobilePanel==='actions'?'active':''}">Actions</button><button data-mobile-panel="zones" class="${mobilePanel==='zones'?'active':''}">Zones</button><button data-mobile-panel="log" class="${mobilePanel==='log'?'active':''}">Log</button>${primary.slice(0,2).map(a=>`<button class="mobile-primary" data-action='${JSON.stringify(a)}'>${a.type==='END_TURN'?'End Turn':a.type==='END_ACTION'?'Pass':a.type==='DRAW'?'Draw':'Rune'}</button>`).join('')}</div>`; } function mobileDrawer(actions){ const contextual=actionForContext(actions); if(mobilePanel==='actions') return `<div class="mobile-drawer"><div class="drawer-title">${contextTarget?'Card / Unit actions':'Available actions'}</div>${contextTarget?`<button class="clear-selection" data-clear-context>Clear selection</button>`:''}<div class="actions">${contextual.map(a=>`<button data-action='${JSON.stringify(a)}'>${a.label}</button>`).join('')||'<div class="empty-action">No contextual actions available.</div>'}</div>${!contextTarget?`<div class="drawer-divider"></div><div class="drawer-title secondary">All actions</div><div class="actions">${actions.map(a=>`<button data-action='${JSON.stringify(a)}'>${a.label}</button>`).join('')}</div>`:''}</div>`; if(mobilePanel==='zones') return `<div class="mobile-drawer"><div class="drawer-title">Table zones</div><div class="mobile-zone-summary"><span>Deck <b>${game.players.find(p=>p.id===game.activePlayer)?.deck.length||0}</b></span><span>Runes <b>${game.players.find(p=>p.id===game.activePlayer)?.runeDeck.length||0}</b></span><span>Trash <b>${game.players.find(p=>p.id===game.activePlayer)?.trash.length||0}</b></span><span>Banished <b>${game.players.find(p=>p.id===game.activePlayer)?.banished.length||0}</b></span></div></div>`; return `<div class="mobile-drawer"><div class="drawer-title">Match timeline</div><div class="mobile-log">${game.log.slice(0,10).map(x=>`<div>${x}</div>`).join('')}</div></div>`; } function gameUI(){ const me=game.players.find(p=>p.id===game.activePlayer)||game.players[0], enemy=game.players.find(p=>p.id!==game.activePlayer)||game.players[1], active=game.players.find(p=>p.id===game.activePlayer), actions=legalActions(game,game.activePlayer); const peek=game.selected?.type?.includes("PEEK"); return `<header><div><h1>RIFTBOUND</h1><span class="prototype">ATLAS-STYLE PRACTICE BOARD</span></div><div class="header-nav"><button id="undo" ${game.history?.length?'':'disabled'}>↶ Undo</button><button id="redo" ${game.future?.length?'':'disabled'}>↷ Redo</button><button id="back">Exit</button></div><div class="header-right">Round ${game.round} · Turn ${game.turn} · <b>${active?.name||''}</b> · ${game.phase}</div></header> <div class="context-banner">${contextTarget?`<span>Selected: <b>${contextTarget.kind==='card'?CARDS[game.players[game.activePlayer].hand.find(x=>x.uid===contextTarget.uid)?.cardId]?.name||'Card':CARDS[game.battlefields.flatMap(b=>b.units).find(u=>u.uid===contextTarget.uid)?.cardId]?.name||'Unit'}</b></span><button data-clear-context>Clear</button>`:`<span>Tap a card or unit for contextual actions. Drag still works for quick placement/movement.</span>`}</div><main class="sim-layout"> <section class="sim-main"> ${playerBar(enemy,"OPPONENT")} <div class="opponent-zones"><div class="zone compact"><b>Hand</b><span>${enemy.hand.length} cards</span></div><div class="zone compact" data-zone="p2-trash"><b>Trash</b><span>${enemy.trash.length}</span></div><div class="zone compact" data-zone="p2-banish"><b>Banished</b><span>${enemy.banished.length}</span></div><div class="zone compact"><b>Rune Deck</b><span>${enemy.runeDeck.length}</span></div></div> <div class="board ${game.selected?.type==='PLACEMENT'?'placement':''}">${game.battlefields.map(b=>`<div class="battlefield" data-bf="${b.id}" data-drop-bf="${b.id}"><div class="bf-head"><div><b>${cardsById.get(b.cardId)?.name||b.cardId}</b><small>${b.units.filter(u=>u.owner==='p1').length} you · ${b.units.filter(u=>u.owner==='p2').length} opp</small></div><span>DROP ZONE</span></div><div class="units">${b.units.map(boardUnit).join('')||'<small class="empty-zone">Drop cards here</small>'}</div></div>`).join('')}</div> <div class="zone-row"><div class="zone" data-zone="p1-deck"><b>DECK</b><span>${me.deck.length}</span><button data-action='${JSON.stringify({type:'DRAW'})}'>Draw</button><button data-action='${JSON.stringify({type:'LOOK_DECK'})}'>Peek</button></div><div class="zone"><b>RUNE DECK</b><span>${me.runeDeck.length}</span><button data-action='${JSON.stringify({type:'REVEAL_RUNE'})}'>Reveal</button><button data-action='${JSON.stringify({type:'LOOK_RUNE'})}'>Peek</button><button data-action='${JSON.stringify({type:'BOTTOM_RUNE'})}'>Bottom</button></div><div class="zone drop-zone" data-drop-zone="trash"><b>TRASH</b><span>${me.trash.length}</span><div class="zone-cards">${zoneCards(me,'trash')}</div></div><div class="zone drop-zone" data-drop-zone="banished"><b>BANISHED</b><span>${me.banished.length}</span><div class="zone-cards">${zoneCards(me,'banished')}</div></div></div> <div class="panel rune-strip"><b>Your revealed Runes</b><div class="rune-cards">${zoneCards(me,'runeZone')}</div></div> ${playerBar(me,"YOU")} <div class="panel hand" data-hand="${me.id}">${me.hand.map(x=>{const c=CARDS[x.cardId];const playable=actions.some(a=>a.type==='PLAY'&&a.cardUid===x.uid);return `<button draggable="true" class="hand-card ${playable?'playable':''} ${contextTarget?.kind==='card'&&contextTarget.uid===x.uid?'context-selected':''}" data-card="${x.uid}" data-context-card="${x.uid}" data-play="${x.uid}"><img src="${img(c)}"><span>${c?.name||x.cardId}</span><small>${c?.energy??c?.cost??'—'} ⚡</small></button>`}).join('')||'<span class="empty-zone">Your hand is empty.</span>'}</div> <div class="panel sim-controls"><div><b>Priority:</b> ${game.priority===game.activePlayer?'You':'Opponent'} · <b>Mode:</b> ${game.practice?'Two-Sided Practice':'Solo'}</div><div class="actions">${actions.map(a=>`<button data-action='${JSON.stringify(a)}'>${a.label}</button>`).join('')}</div></div> ${mobileDrawer(actions)} ${mobileActionBar(actions)} </section> <aside class="sim-sidebar"><div class="panel guide"><h2>Practice Controls</h2><p>Drag cards onto Battlefields or zones. Right-click a card to inspect it. Use Undo/Redo to step through the local action history.</p><button id="switchSeat">Switch Active Seat</button><button id="resetGame">Reset Practice</button></div><div class="panel chain"><h2>Chain</h2>${game.chain.length?game.chain.map(x=>`<div>${x}</div>`).join(''):'<span class="empty-zone">Nothing resolving.</span>'}</div><div class="panel log"><h2>Match Timeline</h2>${game.log.slice(0,14).map(x=>`<div>${x}</div>`).join('')}</div></aside> </main>${peek?`<div class="peek-overlay"><div class="peek-card"><button id="closePeek">×</button><h2>${game.selected.type==='DECK_PEEK'?'Deck Peek':'Rune Peek'}</h2><p>Private inspection for ${game.players.find(p=>p.id===game.selected.playerId)?.name||'player'}.</p>${game.selected.cardId?`<img src="${img(CARDS[game.selected.cardId])}"><h3>${CARDS[game.selected.cardId]?.name||''}</h3>`:`<p>Top card: ${CARDS[game.players.find(p=>p.id===game.selected.playerId)?.deck[0]?.cardId]?.name||'Hidden'}</p>`}</div></div>`:''}${game.winner?`<div class="win-banner">🏆 ${game.players.find(p=>p.id===game.winner)?.name} wins!</div>`:''}`; } function render(){ document.querySelector("#app").innerHTML=screen==="builder"?builder():screen==="cards"?gallery():gameUI(); bind(); } function bind(){ document.querySelectorAll("[data-screen]").forEach(b=>b.onclick=()=>{screen=b.dataset.screen;cardModal=null;render();}); document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=e=>{e.stopPropagation();showCard(cardsById.get(b.dataset.detail));}); document.querySelectorAll("[data-close-modal]").forEach(b=>b.onclick=()=>{cardModal=null;render();}); const sort=document.querySelector("#sortFilter");if(sort)sort.onchange=e=>{sortBy=e.target.value;render();}; const banned=document.querySelector("#showBanned");if(banned)banned.onchange=e=>{showBanned=e.target.checked;render();}; const save=document.querySelector("#saveDeck");if(save)save.onclick=saveDeck; const load=document.querySelector("#loadDeck");if(load)load.onclick=loadSavedDeck; const exp=document.querySelector("#exportDeck");if(exp)exp.onclick=exportDeck; document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;search="";render();}); const s=document.querySelector("#search");if(s)s.oninput=e=>{search=e.target.value;render();}; const sf=document.querySelector("#setFilter");if(sf)sf.onchange=e=>{filterSet=e.target.value;render();}; const tf=document.querySelector("#typeFilter");if(tf)tf.onchange=e=>{filterType=e.target.value;render();}; const df=document.querySelector("#domainFilter");if(df)df.onchange=e=>{filterDomain=e.target.value;render();}; document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addCard(cardsById.get(b.dataset.add))); document.querySelectorAll("[data-remove-main]").forEach(b=>b.onclick=()=>{const i=deck.main.findIndex(c=>c.name===b.dataset.removeMain);if(i>=0)deck.main.splice(i,1);render();}); document.querySelectorAll("[data-remove-rune]").forEach(b=>b.onclick=()=>{const i=deck.runes.findIndex(c=>c.name===b.dataset.removeRune);if(i>=0)deck.runes.splice(i,1);render();}); document.querySelectorAll("[data-remove-bf]").forEach(b=>b.onclick=()=>{deck.battlefields=deck.battlefields.filter(id=>id!==b.dataset.removeBf);render();}); const start=document.querySelector("#start");if(start)start.onclick=()=>startGame(false); const practice=document.querySelector("#practice");if(practice)practice.onclick=()=>startGame(true); document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{try{game=perform(game,JSON.parse(b.dataset.action));contextTarget=null;render();}catch(e){alert(e.message);}}); document.querySelectorAll("[data-context-card]").forEach(b=>b.onclick=e=>{e.stopPropagation();contextTarget={kind:"card",uid:b.dataset.contextCard};mobilePanel="actions";render();}); document.querySelectorAll("[data-context-unit]").forEach(b=>b.onclick=e=>{e.stopPropagation();contextTarget={kind:"unit",uid:b.dataset.contextUnit};mobilePanel="actions";render();}); document.querySelectorAll("[data-clear-context]").forEach(b=>b.onclick=()=>{contextTarget=null;render();}); document.querySelectorAll("[data-play]").forEach(b=>b.ondblclick=()=>{try{game=perform(game,{type:"PLAY",cardUid:b.dataset.play,owner:game.practice?game.activePlayer:'p1'});render();}catch(e){alert(e.message);}}); document.querySelectorAll("[data-bf]").forEach(b=>b.onclick=()=>{if(game.selected?.type==="PLACEMENT"){try{game=placeUnit(game,b.dataset.bf);contextTarget=null;render();}catch(e){alert(e.message);}}}); document.querySelectorAll("[data-inspect]").forEach(b=>{ const inspect=()=>{const uid=b.dataset.inspect;const all=[...game.players.flatMap(p=>[...p.hand,...p.trash,...p.banished,...p.runeZone]),...game.battlefields.flatMap(x=>x.units)];const inst=all.find(x=>x.uid===uid);if(inst)showCard(CARDS[inst.cardId]);}; b.oncontextmenu=e=>{e.preventDefault();inspect();}; b.onclick=e=>{if(e.detail===1) setTimeout(()=>{if(!e.defaultPrevented) inspect();},120);}; }); document.querySelectorAll("[draggable=true]").forEach(el=>{el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.card||el.dataset.unit||'');}); document.querySelectorAll("[data-drop-bf]").forEach(el=>{el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');const hand=game.players[game.activePlayer].hand.find(c=>c.uid===id);if(hand){try{game=perform(game,{type:'PLAY',cardUid:id,owner:game.activePlayer});game=placeUnit(game,el.dataset.dropBf);render();}catch(err){alert(err.message);}}else {try{game=perform(game,{type:'MOVE',unitUid:id,to:el.dataset.dropBf,owner:game.activePlayer});render();}catch(err){alert(err.message);}}};}); document.querySelectorAll('[data-drop-zone]').forEach(el=>{el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');try{game=perform(game,{type:el.dataset.dropZone==='trash'?'TRASH':'BANISH',unitUid:id,owner:game.activePlayer});render();}catch(err){alert(err.message);}};}); const undo=document.querySelector('#undo');if(undo)undo.onclick=()=>{game=perform(game,{type:'UNDO'});render();}; const redo=document.querySelector('#redo');if(redo)redo.onclick=()=>{game=perform(game,{type:'REDO'});render();}; const closePeek=document.querySelector('#closePeek');if(closePeek)closePeek.onclick=()=>{game={...game,selected:null};render();}; const switchSeat=document.querySelector('#switchSeat');if(switchSeat)switchSeat.onclick=()=>{game={...game,activePlayer:game.activePlayer==='p1'?'p2':'p1',priority:game.activePlayer==='p1'?'p2':'p1'};render();}; const reset=document.querySelector('#resetGame');if(reset)reset.onclick=()=>{if(confirm('Reset the current practice game?'))startGame(game?.practice);}; document.querySelectorAll('[data-mobile-panel]').forEach(b=>b.onclick=()=>{mobilePanel=b.dataset.mobilePanel;render();}); const back=document.querySelector('#back');if(back)back.onclick=()=>{screen="builder";game=null;contextTarget=null;render();}; } window.addEventListener("error",e=>console.error(e)); loadCards(); 
