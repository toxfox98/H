); } function cardAllowedAsBattlefield(card,deck,cardsById){ if(!card?.isBattlefield) return false; // Battlefields are colorless and can be used with any Champion Legend. // Only uniqueness and Constructed bans matter here. if(battlefieldIsBanned(card)) return false; if(deck.battlefields.some(id=>id===card.id)) return false; return true; } function validateDeck(deck,cardsById){ const errors=[]; if(!deck.legend) errors.push("Choose a Champion Legend."); if(!deck.chosenChampion) errors.push("Choose a Chosen Champion."); if(deck.main.length!==MAIN_SIZE) errors.push(`Main Deck must contain exactly ${MAIN_SIZE} cards.`); if(deck.runes.length!==RUNE_SIZE) errors.push(`Rune Deck must contain exactly ${RUNE_SIZE} cards.`); if(deck.battlefields.length!==BATTLEFIELD_COUNT) errors.push(`Choose exactly ${BATTLEFIELD_COUNT} battlefields.`); const counts=new Map(); for(const c of deck.main){ counts.set(c.name,(counts.get(c.name)||0)+1); if(counts.get(c.name)>MAX_COPIES) errors.push(`Too many copies of ${c.name}.`); if(cardIsBanned(c)) errors.push(`${c.name} is banned in Constructed.`); if(!matchesDomains(c,domainIdentity(deck,cardsById))) errors.push(`${c.name} is outside your Legend's Domain Identity.`); } if(countSignatures(deck.main)>SIGNATURE_LIMIT) errors.push("A deck may contain at most 3 Signature cards."); const legend=deck.legend && cardsById.get(deck.legend); const champ=deck.chosenChampion && cardsById.get(deck.chosenChampion); if(legend && champ && !(legend.tags||[]).some(t=>(champ.tags||[]).includes(t))) errors.push("Chosen Champion must have a Champion tag matching the Legend."); for(const c of deck.runes){ if(!cardAllowedAsRune(c,deck,cardsById)) errors.push(`${c.name} is not legal for this Rune Deck.`); } if(new Set(deck.battlefields).size!==deck.battlefields.length) errors.push("Battlefields must have unique names."); for(const id of deck.battlefields){ const bf=cardsById.get(id); if(bf && battlefieldIsBanned(bf)) errors.push(`${bf.name} is banned in Constructed.`); } return [...new Set(errors)]; } /* ===== src/main-cards.js ===== */ let CARDS = {}; function setCards(map){ CARDS = map; } /* ===== src/engine.js ===== */ const clone = x => structuredClone(x); const uid = () => Math.random().toString(36).slice(2, 11); const shuffled = a => { const x=[...a]; for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];} return x; }; const opp = id => id === "p1" ? "p2" : "p1"; function makeCard(cardId, owner){ return { uid:uid(), cardId, owner, exhausted:false, empowered:false, damage:0, label:"" }; } function makePlayer(id,name,deck){ return {id,name,energy:1,maxEnergy:1,points:0,hand:[],deck:shuffled(deck.main.map(c=>makeCard(c.id,id))),trash:[],banished:[],runeDeck:shuffled(deck.runes.map(c=>makeCard(c.id,id))),runeZone:[],legend:deck.legend,chosenChampion:deck.chosenChampion}; } function draw(p,n=1){ let count=0; while(n-- && p.deck.length){p.hand.push(p.deck.shift());count++;} return count; } function snapshot(g){ return clone(g); } function useCardDatabase(map){ setCards(map); } function createGame(deck1, deck2, options={}){ const players=[makePlayer("p1",options.p1Name||"Player 1",deck1),makePlayer("p2",options.p2Name||"Player 2",deck2)]; players.forEach(p=>draw(p,4)); return { mode:"riftbound", practice:!!options.practice, turn:1, round:1, activePlayer:"p1", phase:"START", priority:"p1", players, battlefields:deck1.battlefields.map((id,i)=>({id:`bf${i+1}`,cardId:id,units:[]})), chain:[], selected:null, pending:null, winner:null, log:["Game started. Player 1 has priority."], history:[], future:[], actionSeq:0 }; } function publicState(g){return clone(g);} function player(g,id){return g.players.find(p=>p.id===id);} function unitAt(g,id){for(const bf of g.battlefields){const u=bf.units.find(x=>x.uid===id);if(u)return {bf,u};}return null;} function card(id){return CARDS[id] || {}; } function record(g,msg){g.log.unshift(msg);g.log=g.log.slice(0,60);g.actionSeq++;} function saveHistory(g){ const old=g.history||[]; const base=clone(g); base.history=[];base.future=[]; old.push(base);g.history=old.slice(-30);g.future=[]; } function commit(g,msg){ if(msg)record(g,msg); return g; } function resetUsed(g,pid){g.battlefields.forEach(b=>b.units.forEach(u=>{if(u.owner===pid)u.exhausted=false;}));} function perform(game,a){ const g=clone(game); const pid=a.owner || g.activePlayer; const p=player(g,pid); if(!p)throw Error("Player not found."); if(a.type!=="UNDO" && a.type!=="REDO") saveHistory(g); switch(a.type){ case "DRAW": draw(p,1); return commit(g,`${p.name} drew a card.`); case "LOOK_DECK": g.selected={type:"DECK_PEEK",playerId:pid}; return g; case "BURN_TOP": { if(!p.deck.length) return g; const c=p.deck.shift();p.trash.push(c);return commit(g,`${p.name} burned the top card to trash.`); } case "PLAY": { const i=p.hand.findIndex(c=>c.uid===a.cardUid); if(i<0)throw Error("Card is not in hand."); const inst=p.hand[i], c=card(inst.cardId), cost=Number(c.energy??c.cost??0); if(cost>p.energy)throw Error("Not enough Energy."); p.energy-=cost;p.hand.splice(i,1);g.pending={playerId:pid,card:inst};g.selected={type:"PLACEMENT",cardUid:inst.uid};return commit(g,`${p.name} played ${c.name}; choose a battlefield.`); } case "PLACE": { if(!g.pending||g.pending.playerId!==pid)throw Error("No card awaiting placement."); const bf=g.battlefields.find(x=>x.id===a.bfId);if(!bf)throw Error("Invalid battlefield."); const inst=g.pending.card;bf.units.push({...inst});g.pending=null;g.selected=null;return commit(g,`${p.name} deployed ${card(inst.cardId).name} to ${card(bf.cardId).name}.`); } case "MOVE": { const hit=unitAt(g,a.unitUid),dest=g.battlefields.find(b=>b.id===a.to);if(!hit||!dest)throw Error("Invalid move."); if(hit.u.owner!==pid)throw Error("You can only move your own unit in practice mode.");hit.bf.units=hit.bf.units.filter(u=>u.uid!==a.unitUid);hit.u.exhausted=true;dest.units.push(hit.u);return commit(g,`${p.name} moved ${card(hit.u.cardId).name}.`); } case "EXHAUST": {const hit=unitAt(g,a.unitUid);if(!hit)throw Error("Unit not found.");if(hit.u.owner!==pid && !g.practice)throw Error("Not your unit.");hit.u.exhausted=!hit.u.exhausted;return commit(g,`${card(hit.u.cardId).name} ${hit.u.exhausted?"exhausted":"readied"}.`);} case "TRASH": return moveUnit(g,a, "trash", pid); case "BANISH": return moveUnit(g,a, "banished", pid); case "RECYCLE": return recycle(g,a,pid); case "CAPTURE": {const hit=unitAt(g,a.unitUid);if(!hit)throw Error("Unit not found.");hit.u.captured=true;return commit(g,`${card(hit.u.cardId).name} was captured.`);} case "ATTACK": { const hit=unitAt(g,a.unitUid);if(!hit)throw Error("Unit not found.");if(hit.u.owner!==pid&&!g.practice)throw Error("Not your unit."); hit.u.exhausted=true;g.selected={type:"ATTACK",unitUid:a.unitUid,bfId:hit.bf.id}; const target=hit.bf.units.find(u=>u.owner!==hit.u.owner&&!u.captured); if(target) g.selected.targetUid=target.uid; return commit(g,`${card(hit.u.cardId).name} attacked at ${card(hit.bf.cardId).name}.`); } case "CONQUER": {const hit=unitAt(g,a.unitUid);if(!hit)throw Error("Unit not found.");if(hit.u.owner!==pid&&!g.practice)throw Error("Not your unit.");p.points++;hit.u.exhausted=true;record(g,`${p.name} scored at ${card(hit.bf.cardId).name}.`);checkWinner(g);return g;} case "EMPOWER": {const hit=unitAt(g,a.unitUid);if(!hit)throw Error("Unit not found.");if(hit.u.owner!==pid&&!g.practice)throw Error("Not your unit.");const cost=Number(a.cost||1);if(p.energy<cost)throw Error("Not enough Energy.");p.energy-=cost;hit.u.empowered=true;return commit(g,`${card(hit.u.cardId).name} was Empowered.`);} case "REVEAL_RUNE": {if(!p.runeDeck.length)throw Error("Rune Deck is empty.");const r=p.runeDeck.shift();p.runeZone.push(r);return commit(g,`${p.name} revealed a Rune.`);} case "LOOK_RUNE": {g.selected={type:"RUNE_PEEK",playerId:pid,cardId:p.runeDeck[0]?.cardId||null};return g;} case "BOTTOM_RUNE": {if(!p.runeDeck.length)return g;p.runeDeck.push(p.runeDeck.shift());return commit(g,`${p.name}